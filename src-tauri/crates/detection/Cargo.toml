[package]
name = "rhema-detection"
version = "0.1.0"
edition = "2021"
license = "MIT"

[lints]
workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
log.workspace = true
thiserror.workspace = true
aho-corasick = "1"
lru = "0.18.2"
rhema-bible = { path = "../bible" }
sha2 = "0.10"

# Optional heavy dependencies for real embedding / vector search
ort = { version = "2.0.0-rc.12", optional = true }
ndarray = { version = "0.17", optional = true }
tokenizers = { version = "0.22", default-features = false, features = ["progressbar", "onig"], optional = true }
bytemuck = { version = "1", features = ["derive"], optional = true }
rayon = { version = "1", optional = true }

# Dependencies only needed by the precompute binary
env_logger = { version = "0.11", optional = true }

[dev-dependencies]
tempfile = "3"
proptest = "1"

[features]
default = []
onnx = ["ort", "ndarray", "tokenizers"]
vector-search = ["bytemuck", "rayon"]
precompute-bin = ["onnx", "vector-search", "env_logger"]

[[bin]]
name = "precompute"
path = "src/bin/precompute.rs"
required-features = ["precompute-bin"]

[[bin]]
name = "score_distribution"
path = "src/bin/score_distribution.rs"
required-features = ["precompute-bin"]

[[bin]]
name = "detection_accuracy"
path = "src/bin/detection_accuracy.rs"
required-features = ["precompute-bin"]

[[bin]]
name = "egw_accuracy"
path = "src/bin/egw_accuracy.rs"
required-features = ["precompute-bin"]

[[bin]]
name = "live_probe"
path = "src/bin/live_probe.rs"
required-features = ["precompute-bin"]

[[bin]]
name = "quantize_embeddings"
path = "src/bin/quantize_embeddings.rs"

[[bin]]
name = "embedding_comparison"
path = "src/bin/embedding_comparison.rs"
required-features = ["vector-search"]

[[bin]]
name = "command_benchmark"
path = "src/bin/command_benchmark.rs"
required-features = ["onnx"]
